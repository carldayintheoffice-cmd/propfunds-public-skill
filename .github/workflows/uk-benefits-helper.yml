name: uk-benefits-helper

on:
  push:
    paths: ['uk-benefits-helper/**', '.github/workflows/uk-benefits-helper.yml']
  pull_request:
    paths: ['uk-benefits-helper/**', '.github/workflows/uk-benefits-helper.yml']
  schedule:
    - cron: '17 7 * * 1' # every Monday: check GOV.UK for rule changes
  workflow_dispatch:

defaults:
  run:
    working-directory: uk-benefits-helper

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  govuk-watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Fails (and emails the repo owner) when a GOV.UK page we rely on changes.
      - run: npm run watch-govuk
